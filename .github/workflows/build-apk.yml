name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms" || { echo "Android SDK not found"; exit 1; }
          ls "$ANDROID_HOME/platforms"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify separate Android package
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("app/build/outputs/apk/debug/output-metadata.json")
          data = json.loads(p.read_text())
          actual = data.get("applicationId")
          print("Built APK applicationId:", actual)
          assert actual == "com.envarg.inventory.pro2026", "Unexpected application ID"
          assert any(e.get("outputFile") == "app-debug.apk" for e in data["elements"])
          PY
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Envarg-Inventory-Pro-V12-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish downloadable V12 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Envarg-Inventory-Pro-V12.apk
          gh release view inventory-pro-v12 >/dev/null 2>&1 || gh release create inventory-pro-v12 --title "Envarg Inventory Pro V12" --notes "Glossy black stock manager with blinking balance" --target "$GITHUB_SHA"
          gh release upload inventory-pro-v12 Envarg-Inventory-Pro-V12.apk --clobber
