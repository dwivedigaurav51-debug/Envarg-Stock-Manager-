<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Envarg Stock</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f5f7fc;color:#24324c}header{background:white;padding:22px 18px 18px;border-bottom:1px solid #e7eaf4;display:flex;align-items:center;justify-content:space-between}header small{color:#5467dd;font-weight:800;letter-spacing:1.2px}h2{margin:5px 0;font-size:22px}select,input,button{font:inherit;border-radius:12px;padding:13px;border:1px solid #e0e5f0;width:100%;background:#f9faff}button{background:#566bea;color:white;font-weight:700;border:0}main{padding:16px 14px 100px;max-width:760px;margin:auto}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:white;border-radius:17px;padding:17px 14px;box-shadow:0 5px 18px #172a5010;border-top:5px solid #6375ef}.card:nth-child(4n+2){border-color:#10af88}.card:nth-child(4n+3){border-color:#ffa142}.card:nth-child(4n+4){border-color:#a579ef}.card b{font-size:13px}.card strong{display:block;font-size:28px;margin:10px 0 2px}.card small{color:#71809b}.actions{display:flex;gap:10px;margin:18px 0}.actions button:first-child{background:#11aa85}.actions button:last-child{background:#ed8645}.actions button{min-height:57px}section{background:white;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 4px 20px #14274b0b}h3{margin:2px 0 16px}label{display:block;color:#63718b;font-size:13px;font-weight:650;margin:15px 0 6px}form button{margin-top:18px}.secondary{background:#eaf0ff;color:#405acb}.danger{background:#fff0f1;color:#c53249}.tab{display:none}.tab.active{display:block}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:white;padding:8px;box-shadow:0 -4px 18px #172b4a19}nav button{background:transparent;color:#8792a9;font-size:12px;flex:1;padding:10px 0}nav button.active{background:#eaf0ff;color:#5266dc}.item{border-bottom:1px solid #e8ecf5;padding:12px 0}.item small{color:#69758a}.item button{width:auto;padding:7px 11px;margin:6px 4px 0 0;font-size:12px}.empty{color:#77839b}.warn{color:#d87927!important}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
</style></head><body><header><div><small>ENVARG CIRCUITS</small><h2>Sensor Stock Manager</h2></div><select id="lang" style="width:95px" onchange="language(this.value)"><option value="en">English</option><option value="hi">हिन्दी</option></select></header><main>
<div id="dashboard" class="tab active"><p id="status" class="empty"></p><div id="cards" class="cards"></div><div class="actions"><button onclick="tab('entry');document.getElementById('kind').value='IN'" data-en="+ Stock IN" data-hi="+ माल आया">+ Stock IN</button><button onclick="tab('entry');document.getElementById('kind').value='OUT'" data-en="↗ Stock OUT" data-hi="↗ माल भेजा">↗ Stock OUT</button></div></div>
<div id="entry" class="tab"><section><h3 data-en="Stock Entry" data-hi="स्टॉक एंट्री">Stock Entry</h3><form id="form"><input type="hidden" id="edit"><label data-en="Category" data-hi="कैटेगरी">Category</label><select id="category" required></select><label data-en="Entry Type" data-hi="एंट्री प्रकार">Entry Type</label><select id="kind"><option value="IN">Stock Received (IN)</option><option value="OUT">Stock Dispatched (OUT)</option><option value="ADJUST">Stock Adjustment (+)</option></select><label data-en="Quantity (pcs)" data-hi="मात्रा (पीस)">Quantity (pcs)</label><input id="qty" type="number" min="1" step="1" required><label data-en="Date (past dates allowed)" data-hi="तारीख (पुरानी तारीख भी)">Date (past dates allowed)</label><input id="date" type="date" required><label data-en="Party / Customer" data-hi="पार्टी / ग्राहक">Party / Customer</label><input id="party" placeholder="Moon Light"><button id="save" type="submit" data-en="Save Entry" data-hi="एंट्री सेव करें">Save Entry</button><button type="button" class="secondary" onclick="reset()" data-en="New Entry" data-hi="नई एंट्री">New Entry</button></form></section></div>
<div id="history" class="tab"><section><h3 data-en="Stock History" data-hi="स्टॉक हिस्ट्री">Stock History</h3><input id="search" oninput="render()" placeholder="Search party or category"><div class="row" style="margin-top:12px"><button class="secondary" onclick="csv()" data-en="Export CSV" data-hi="CSV डाउनलोड">Export CSV</button><button class="secondary" onclick="backup()" data-en="Backup JSON" data-hi="बैकअप JSON">Backup JSON</button></div><div id="historyList"></div></section></div>
<div id="settings" class="tab"><section><h3 data-en="Add Category" data-hi="कैटेगरी जोड़ें">Add Category</h3><form id="newcat"><label data-en="Category Name" data-hi="कैटेगरी नाम">Category Name</label><input id="catname" required><label data-en="Opening Stock" data-hi="शुरुआती स्टॉक">Opening Stock</label><input id="opening" type="number" value="0" required><label data-en="Low Stock Alert" data-hi="कम स्टॉक अलर्ट">Low Stock Alert</label><input id="min" type="number" value="20" min="0" required><button data-en="Add Category" data-hi="कैटेगरी जोड़ें">Add Category</button></form></section><section><h3 data-en="Edit Category Stock Settings" data-hi="कैटेगरी स्टॉक सेटिंग">Edit Category Stock Settings</h3><select id="settingcat" onchange="settingView()"></select><label data-en="Opening Stock" data-hi="शुरुआती स्टॉक">Opening Stock</label><input id="setopening" type="number"><label data-en="Low Stock Alert" data-hi="कम स्टॉक अलर्ट">Low Stock Alert</label><input id="setmin" type="number" min="0"><button onclick="saveSetting()" data-en="Save Settings" data-hi="सेटिंग सेव करें">Save Settings</button></section><section><h3 data-en="Restore Backup" data-hi="बैकअप वापस लाएँ">Restore Backup</h3><input type="file" id="restore" accept="application/json" onchange="restoreFile(this)"><p class="empty" data-en="Data is stored on this phone. Keep backups before uninstalling." data-hi="डेटा इस फोन में सेव है। ऐप हटाने से पहले बैकअप रखें।">Data is stored on this phone. Keep backups before uninstalling.</p></section></div>
</main><nav><button class="active" data-tab="dashboard" onclick="tab('dashboard')" data-en="⌂ Dashboard" data-hi="⌂ डैशबोर्ड">⌂ Dashboard</button><button data-tab="entry" onclick="tab('entry')" data-en="＋ Entry" data-hi="＋ एंट्री">＋ Entry</button><button data-tab="history" onclick="tab('history')" data-en="▤ History" data-hi="▤ हिस्ट्री">▤ History</button><button data-tab="settings" onclick="tab('settings')" data-en="⚙ Settings" data-hi="⚙ सेटिंग">⚙ Settings</button></nav>
<script>
const KEY='envarg_inventory_v1',LANG='envarg_lang';const el=id=>document.getElementById(id);
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.categories)||!Array.isArray(state.movements))state={categories:['3A Sensor','5A Sensor','3A Premium Sensor','5A Premium Sensor'].map((name,i)=>({id:'cat'+i,name,opening:0,min:20})),movements:[]};
let lang=localStorage.getItem(LANG)||'en';function persist(){localStorage.setItem(KEY,JSON.stringify(state))}function dateToday(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function stock(c){return Number(c.opening)+state.movements.filter(m=>m.category===c.id).reduce((a,m)=>a+(m.kind==='OUT'?-m.qty:m.qty),0)}function safe(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function tab(id){document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.id===id));document.querySelectorAll('nav button').forEach(e=>e.classList.toggle('active',e.dataset.tab===id));window.scrollTo(0,0)}
function language(l){lang=l;localStorage.setItem(LANG,l);el('lang').value=l;document.documentElement.lang=l;document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset[l]);render()}
function render(){el('cards').innerHTML=state.categories.map(c=>'<div class="card"><b>'+safe(c.name)+'</b><strong>'+stock(c)+'</strong><small class="'+(stock(c)<=c.min?'warn':'')+'">'+(stock(c)<=c.min?(lang==='hi'?'⚠ कम स्टॉक':'⚠ Low stock'):(lang==='hi'?'पीस उपलब्ध':'pcs available'))+'</small></div>').join('');el('status').textContent=(lang==='hi'?'कुल स्टॉक: ':'Total stock: ')+state.categories.reduce((s,c)=>s+stock(c),0)+' pcs';const old=el('category').value,old2=el('settingcat').value;for(const id of ['category','settingcat'])el(id).innerHTML=state.categories.map(c=>'<option value="'+safe(c.id)+'">'+safe(c.name)+'</option>').join('');if(state.categories.some(c=>c.id===old))el('category').value=old;if(state.categories.some(c=>c.id===old2))el('settingcat').value=old2;settingView();let q=el('search').value.toLowerCase();el('historyList').innerHTML=state.movements.slice().sort((a,b)=>b.date.localeCompare(a.date)).filter(m=>{let c=state.categories.find(x=>x.id===m.category);return [c?.name,m.party,m.date].join(' ').toLowerCase().includes(q)}).map(m=>{let c=state.categories.find(x=>x.id===m.category);return '<div class="item"><b>'+safe(c?.name||'Unknown')+'</b> · <b style="color:'+(m.kind==='OUT'?'#e87942':'#0fa982')+'">'+safe(m.kind)+' '+m.qty+'</b><br><small>'+safe(m.date)+' · '+safe(m.party)+'</small><br><button class="secondary" onclick="editMove('+JSON.stringify(m.id)+')">Edit</button><button class="danger" onclick="deleteMove('+JSON.stringify(m.id)+')">Delete</button></div>'}).join('')||'<p class="empty">No entries yet</p>'}
function reset(){el('form').reset();el('edit').value='';el('date').value=dateToday();el('save').textContent=lang==='hi'?'एंट्री सेव करें':'Save Entry'}
el('form').onsubmit=e=>{e.preventDefault();let qty=Number(el('qty').value),kind=el('kind').value,c=state.categories.find(x=>x.id===el('category').value);if(!c||!Number.isInteger(qty)||qty<1)return alert('Invalid quantity');let id=el('edit').value;let old=state.movements.find(x=>x.id===id);let available=stock(c)+(old&&old.category===c.id?(old.kind==='OUT'?old.qty:-old.qty):0);if(kind==='OUT'&&qty>available)return alert(lang==='hi'?'स्टॉक कम है':'Insufficient stock');let m={id:id||String(Date.now())+Math.random().toString(36).slice(2),category:c.id,kind,qty,date:el('date').value,party:el('party').value.trim()};if(old)Object.assign(old,m);else state.movements.push(m);persist();reset();render();tab('dashboard')};
function editMove(id){let m=state.movements.find(x=>x.id===id);if(!m)return;el('edit').value=m.id;el('category').value=m.category;el('kind').value=m.kind;el('qty').value=m.qty;el('date').value=m.date;el('party').value=m.party;el('save').textContent=lang==='hi'?'अपडेट करें':'Update Entry';tab('entry')}
function deleteMove(id){if(!confirm('Delete this entry?'))return;state.movements=state.movements.filter(x=>x.id!==id);persist();render()}
el('newcat').onsubmit=e=>{e.preventDefault();let name=el('catname').value.trim();if(!name||state.categories.some(c=>c.name.toLowerCase()===name.toLowerCase()))return alert('Invalid or duplicate category');state.categories.push({id:'cat'+Date.now(),name,opening:Number(el('opening').value)||0,min:Number(el('min').value)||0});persist();el('newcat').reset();render()};
function settingView(){let c=state.categories.find(x=>x.id===el('settingcat').value);if(c){el('setopening').value=c.opening;el('setmin').value=c.min}}
function saveSetting(){let c=state.categories.find(x=>x.id===el('settingcat').value);if(!c)return;c.opening=Number(el('setopening').value)||0;c.min=Math.max(0,Number(el('setmin').value)||0);persist();render();alert('Saved')}
function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
function csv(){let rows=[['Date','Category','Type','Quantity','Party'],...state.movements.map(m=>[m.date,state.categories.find(c=>c.id===m.category)?.name||'',m.kind,m.qty,m.party])];download('envarg-stock.csv','\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')}
function backup(){download('envarg-stock-backup.json',JSON.stringify(state,null,2),'application/json')}
function restoreFile(inp){let f=inp.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!Array.isArray(d.categories)||!Array.isArray(d.movements))throw Error();if(confirm('Replace current stock data with this backup?')){state=d;persist();render();tab('dashboard')}}catch(e){alert('Invalid backup file')}};reader.readAsText(f)}
reset();language(lang);persist();
</script></body></html>
